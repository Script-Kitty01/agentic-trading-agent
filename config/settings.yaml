app:
  name: "AlpachaBot"
  paper: true
  dry_run: false
  db_path: "data/alpacha.db"
  models_dir: "data/models"

data:
  symbols:
    # Core Broad Market & Sector ETFs
    - "SPY"
    - "QQQ"
    - "IWM"
    - "VOO"
    - "VTI"
    - "VT"
    - "IVV"
    # Fixed Income / Treasury Bonds (Hedge)
    - "TLT"
    # Commodities, Energy & Precious Metals (Hedge)
    - "GLD"
    - "SLV"
    - "USO"
    - "XLE"
    # High-Beta & Growth Equities
    - "COIN"
    - "NVDA"
    - "TSLA"
    - "AMD"
    - "META"
    - "MSFT"
    - "AAPL"
    - "GOOGL"
    - "AMZN"
    # Financials, Healthcare & Value Blue-Chips
    - "BRK.B"
    - "JPM"
    - "COST"
    - "JNJ"
  timeframe: "1Min"
  history_days: 40
  refresh_interval_sec: 60

model:
  daily_lags: 1
  weekly_lags: 5
  monthly_lags: 22
  use_leverage: true
  use_jumps: true
  jump_alpha: 0.01
  iv_vs_rv_multiple: 1.2
  retrain_if_older_days: 5
  min_train_days: 20

risk:
  warn_drawdown_pct: 0.02       # 2.0% warning threshold (reduce sizing & block entries)
  kill_drawdown_pct: 0.035      # 3.5% hard kill switch (liquidate & stop)
  max_portfolio_bp_pct: 0.30    # Maximum 30% buying power allocation
  max_contracts_per_trade: 10   # Maximum 10 contracts per trade
  single_trade_max_loss_pct: 0.03 # 3% risk allocation per trade
  max_open_positions: 5         # Cap at 5 concurrent live Iron Condor spreads
  max_positions_per_symbol: 1   # Prevent stacking multiple spreads on the same symbol
  max_total_portfolio_risk_pct: 0.20 # Max 20% aggregate portfolio risk
  use_risk_parity: true         # Inverse-volatility weighting across asset classes
  target_annualized_vol: 0.15   # Benchmark volatility for sizing
  caps:
    equity_max_pct: 0.50        # Max 50% exposure in Equities
    fixed_income_max_pct: 0.25  # Max 25% exposure in Fixed Income (TLT)
    commodities_max_pct: 0.25   # Max 25% exposure in Commodities (GLD, SLV, USO, XLE)
    single_symbol_max_pct: 0.08 # Max 8% exposure in any single ticker

strategy:
  target_delta: 0.20
  delta_tolerance: 0.08
  min_dte: 1                    # 1-4 DTE for Thursday/Friday Hackathon Expiry
  max_dte: 4
  target_dte: 2                 # Target Thursday/Friday for fast theta decay
  macro_buffer_hours: 2.0
  min_credit: 0.40              # Minimum $0.40 net credit per spread
  min_market_iv: 0.10           # Minimum 10% market IV floor
  profit_target_pct: 0.30       # Fast profit taking at 30% gain
  stop_loss_multiplier: 1.0     # Tight 1.0x stop loss protection
  momentum_profit_target_pct: 0.35 # +35% upside target on momentum call spreads
  momentum_stop_loss_pct: 0.15     # -15% stop loss on momentum call spreads
  exit_dte_threshold: 0
  close_dte_threshold: 0
  contango_min_ratio: 0.98

execution:
  scan_cron_minutes: "*/5"
  trading_hours_only: true
  order_poll_timeout_sec: 60
  order_poll_interval_sec: 2
  limit_price_offset: 0.01

alerts:
  enabled: true
  webhook_url: ""

